<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>igv.js Playwright harness</title>
</head>
<body>

<div id="igv-div"></div>

<script type="module">

    import igv from "../../js/index.js"

    // Driven by test/e2e/harness.js. Each entry point resolves to a plain, serializable result so the test can
    // assert on what an embedder observes: whether the call resolved, or the message it rejected with.
    const settle = async call => {
        try {
            await call()
            return {resolved: true}
        } catch (e) {
            return {resolved: false, message: e.message || String(e)}
        }
    }

    // Every loadfailures event a listener received, in order. Functions can't cross page.evaluate, so the
    // listener is registered here: through createBrowser's `listeners` option, or on the browser afterwards.
    window.loadFailureEvents = []
    const recordLoadFailures = failures => window.loadFailureEvents.push(failures)

    window.createBrowser = (config, {listen} = {}) => settle(async () => {
        if (listen) {
            config = {...config, listeners: {loadfailures: recordLoadFailures}}
        }
        window.createBrowserConfig = config
        window.browser = await igv.createBrowser(document.getElementById("igv-div"), config)
    })

    // The genome definition object createBrowser was given, as it stands now
    window.genomeDefinition = () => window.createBrowserConfig.genome

    window.search = locus => settle(() => window.browser.search(locus))

    window.currentLoci = () => window.browser.currentLoci()

    window.listenForLoadFailures = () => window.browser.on("loadfailures", recordLoadFailures)

    window.loadTrackList = configs => settle(() => window.browser.loadTrackList(configs))

    window.loadSession = session => settle(() => window.browser.loadSession(session))

    window.loadGenome = genome => settle(() => window.browser.loadGenome(genome))

    // The center of the first data panel of the first track of `type`, in page coordinates, for a real mouse click
    window.trackViewportCenter = type => {
        const trackView = window.browser.trackViews.find(trackView => trackView.track.type === type)
        const {x, y, width, height} = trackView.viewports[0].viewportElement.getBoundingClientRect()
        return {x: x + width / 2, y: y + height / 2}
    }

    window.harnessReady = true

</script>

</body>
</html>
